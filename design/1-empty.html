<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty, waiting for a file</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0A6CC2}a:hover{color:#08589F}
</style>
</head>
<body>
<div style="width: 360px; height: 720px; box-sizing: border-box; background: #FFFFFF; color: #1E1E1E; font-family: Inter, system-ui, sans-serif; font-size: 12px; line-height: 16px; display: flex; flex-direction: column">

<section style="padding: 16px; border-bottom: 1px solid #E6E6E6; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 11px; font-weight: 600; line-height: 16px">Instructions for your AI</h2>
<p style="margin: 0; color: #6B6B6B">Copy these into any AI with your design idea. It will write the JSON file for you.</p>
<div style="display: flex; align-items: center; gap: 12px">
<button style="height: 32px; padding: 0 12px; border: 1px solid #E6E6E6; border-radius: 6px; background: #FFFFFF; color: #1E1E1E; font: 500 12px Inter, system-ui, sans-serif; display: flex; align-items: center; gap: 6px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
Copy instructions</button>
<a href="#">Open as web page</a>
</div>
</section>

<section style="padding: 16px; border-bottom: 1px solid #E6E6E6; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0 0 4px; font-size: 11px; font-weight: 600; line-height: 16px">What to build</h2>
<label style="height: 32px; display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="checkbox" checked style="width: 14px; height: 14px; margin: 0; accent-color: #0A6CC2"> Design system</label>
<label style="height: 32px; display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="checkbox" checked style="width: 14px; height: 14px; margin: 0; accent-color: #0A6CC2"> Components</label>
<label style="height: 32px; display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="checkbox" checked style="width: 14px; height: 14px; margin: 0; accent-color: #0A6CC2"> Screens</label>
<label style="height: 32px; display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="checkbox" checked style="width: 14px; height: 14px; margin: 0; accent-color: #0A6CC2"> SVGs</label>
<label style="height: 32px; display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="checkbox" style="width: 14px; height: 14px; margin: 0; accent-color: #0A6CC2"> Prototype &amp; animations</label>
</section>

<section style="padding: 16px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
<h2 style="margin: 0; font-size: 11px; font-weight: 600; line-height: 16px">JSON file</h2>
<div style="flex-grow: 1; border: 1px dashed #C4C4C4; border-radius: 8px; background: #FAFAFA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"></path><path d="M7.5 8.5L12 4l4.5 4.5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
<p style="margin: 0; font-weight: 500">Drop a .json file here</p>
<button style="height: 32px; padding: 0 12px; border: 1px solid #E6E6E6; border-radius: 6px; background: #FFFFFF; color: #1E1E1E; font: 500 12px Inter, system-ui, sans-serif; cursor: pointer">Choose file</button>
<a href="2-paste.html">Paste JSON instead</a>
</div>
</section>

<footer style="padding: 16px; border-top: 1px solid #E6E6E6">
<button disabled style="width: 100%; height: 32px; border: 0; border-radius: 6px; background: #EDEDED; color: #6B6B6B; font: 500 12px Inter, system-ui, sans-serif">Add a file to build</button>
</footer>

</div>
</body>
</html>
